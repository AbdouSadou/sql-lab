<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL Lab on a phone, result tab</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,400;0,600;1,400&amp;family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2647C8}a:hover{color:#1D3AA8}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #EEF1F0; color: #14213D; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; font-size: 14px; line-height: 1.45">

<header style="display: flex; align-items: center; gap: 8px; height: 56px; box-sizing: border-box; padding: 6px 12px; border-bottom: 1px solid #D5DCDD">
<svg role="img" aria-label="SQL Lab" width="28" height="28" viewBox="0 0 24 24" style="flex: none"><rect width="24" height="24" rx="6" style="fill: #2647C8"></rect><ellipse cx="12" cy="8" rx="5.5" ry="2" style="fill: none; stroke: #FFFFFF; stroke-width: 1.5"></ellipse><path d="M6.5 8v8c0 1.1 2.46 2 5.5 2s5.5-.9 5.5-2V8" style="fill: none; stroke: #FFFFFF; stroke-width: 1.5"></path><path d="M6.5 12c0 1.1 2.46 2 5.5 2s5.5-.9 5.5-2" style="fill: none; stroke: #FFFFFF; stroke-width: 1.5"></path></svg>
<button type="button" aria-haspopup="menu" style="flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 1px solid #7C8891; border-radius: 6px; background: #FCFDFC; color: #14213D; font: inherit; text-align: left; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="flex: none; fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"></path><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"></path></svg>
<span style="flex-grow: 1">Northlight Retail</span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="flex: none; fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<button type="button" aria-label="More actions" aria-haspopup="menu" style="flex: none; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #14213D; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" style="flex: none; fill: currentColor"><circle cx="5" cy="12" r="1.75"></circle><circle cx="12" cy="12" r="1.75"></circle><circle cx="19" cy="12" r="1.75"></circle></svg>
</button>
</header>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid #D5DCDD">
<button type="button" style="height: 48px; padding: 0 8px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #55606E; font: inherit; cursor: pointer">Editor</button>
<button type="button" aria-current="true" style="height: 48px; padding: 0 8px; border: 0; border-bottom: 2px solid #2647C8; background: transparent; color: #14213D; font: inherit; font-weight: 600; cursor: pointer">Result</button>
</div>

<main style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: #FCFDFC">
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; box-sizing: border-box; padding: 4px 4px 4px 16px">
<span style="color: #55606E">10 rows in 1 ms</span>
<button type="button" style="display: flex; align-items: center; gap: 6px; height: 44px; margin-left: auto; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: #14213D; font: inherit; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="flex: none; fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path><path d="M12 15V3"></path></svg>
<span>Download CSV</span>
</button>
</div>
<div style="padding: 4px 16px 16px; overflow-x: auto">
<table style="border-collapse: collapse; border-top: 2px solid #14213D; border-bottom: 2px solid #14213D; font-family: 'Atkinson Hyperlegible Mono', ui-monospace, monospace; font-size: 14px; line-height: 1.6; font-variant-numeric: tabular-nums">
<thead>
<tr>
<th scope="col" style="padding: 8px 24px 8px 4px; border-bottom: 1px solid #14213D; text-align: left; font-weight: 600">product_name</th>
<th scope="col" style="padding: 8px 4px 8px 24px; border-bottom: 1px solid #14213D; text-align: right; font-weight: 600">unit_price</th>
</tr>
</thead>
<tbody>
<tr>
<td style="padding: 6px 24px 6px 4px; border-bottom: 1px solid #D5DCDD">27-inch Monitor</td>
<td style="padding: 6px 4px 6px 24px; border-bottom: 1px solid #D5DCDD; text-align: right">189</td>
</tr>
<tr>
<td style="padding: 6px 24px 6px 4px; border-bottom: 1px solid #D5DCDD">Waterproof Jacket</td>
<td style="padding: 6px 4px 6px 24px; border-bottom: 1px solid #D5DCDD; text-align: right">89</td>
</tr>
<tr>
<td style="padding: 6px 24px 6px 4px; border-bottom: 1px solid #D5DCDD">Mechanical Keyboard</td>
<td style="padding: 6px 4px 6px 24px; border-bottom: 1px solid #D5DCDD; text-align: right">79.99</td>
</tr>
<tr>
<td style="padding: 6px 24px 6px 4px; border-bottom: 1px solid #D5DCDD">Knife Set</td>
<td style="padding: 6px 4px 6px 24px; border-bottom: 1px solid #D5DCDD; text-align: right">64</td>
</tr>
<tr>
<td style="padding: 6px 24px 6px 4px; border-bottom: 1px solid #D5DCDD">Bluetooth Speaker</td>
<td style="padding: 6px 4px 6px 24px; border-bottom: 1px solid #D5DCDD; text-align: right">49.99</td>
</tr>
<tr>
<td style="padding: 6px 24px 6px 4px; border-bottom: 1px solid #D5DCDD">Cast Iron Skillet</td>
<td style="padding: 6px 4px 6px 24px; border-bottom: 1px solid #D5DCDD; text-align: right">39.95</td>
</tr>
<tr>
<td style="padding: 6px 24px 6px 4px; border-bottom: 1px solid #D5DCDD">USB-C Hub</td>
<td style="padding: 6px 4px 6px 24px; border-bottom: 1px solid #D5DCDD; text-align: right">34.5</td>
</tr>
<tr>
<td style="padding: 6px 24px 6px 4px; border-bottom: 1px solid #D5DCDD">Hoodie</td>
<td style="padding: 6px 4px 6px 24px; border-bottom: 1px solid #D5DCDD; text-align: right">32</td>
</tr>
<tr>
<td style="padding: 6px 24px 6px 4px; border-bottom: 1px solid #D5DCDD">Electric Kettle</td>
<td style="padding: 6px 4px 6px 24px; border-bottom: 1px solid #D5DCDD; text-align: right">29.99</td>
</tr>
<tr>
<td style="padding: 6px 24px 6px 4px">Wireless Mouse</td>
<td style="padding: 6px 4px 6px 24px; text-align: right">24.99</td>
</tr>
</tbody>
</table>
</div>
</main>

<div style="display: flex; align-items: center; height: 64px; box-sizing: border-box; padding: 10px 12px; border-top: 1px solid #D5DCDD">
<button type="button" style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 16px; border: 0; border-radius: 6px; background: #2647C8; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" style="flex: none; fill: currentColor"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
<span>Run</span>
</button>
</div>

</div>
</body>
</html>
