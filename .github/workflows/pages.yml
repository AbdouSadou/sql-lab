name: pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/configure-pages@v6
            # The site is the repo root as-is (no build step). Stage a copy
            # without dev-only files, then upload that copy.
            - name: Stage site
              run: |
                  rsync -a \
                      --exclude='/.git' \
                      --exclude='/.github' \
                      --exclude='/.gitignore' \
                      --exclude='/.site-stage' \
                      --exclude='/tests' \
                      --exclude='/node_modules' \
                      --exclude='/package.json' \
                      --exclude='/package-lock.json' \
                      --exclude='/playwright.config.js' \
                      ./ .site-stage/
            # upload-pages-artifact drops dotfiles by default
            # (it tars with --exclude='.[^/]*'), which would drop .nojekyll.
            # include-hidden-files keeps it; .git and .github stay excluded
            # by the action regardless.
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: .site-stage
                  include-hidden-files: true
            - id: deploy
              uses: actions/deploy-pages@v5
