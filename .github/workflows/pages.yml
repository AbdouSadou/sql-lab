name: pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/configure-pages@v6
            # The site is the repo root as-is (no build step). Stage a copy
            # without dev-only files, then upload that copy.
            - name: Stage site
              run: |
                  rsync -a \
                      --exclude='/.git' \
                      --exclude='/.github' \
                      --exclude='/.gitignore' \
                      --exclude='/.site-stage' \
                      --exclude='/tests' \
                      --exclude='/node_modules' \
                      --exclude='/package.json' \
                      --exclude='/package-lock.json' \
                      --exclude='/playwright.config.js' \
                      --exclude='/docs' \
                      --exclude='/tools' \
                      ./ .site-stage/
            # GitHub Pages cannot list a folder, and the app finds the exercise sets by
            # reading the folder page (listSets in js/lab/exercises.js; python3 -m http.server
            # writes such a page by itself). So write one here, at deploy time: adding a set
            # stays "commit exercises/<id>.json and nothing else". nullglob makes an empty
            # folder give a page with no links instead of a link to the pattern itself.
            # tests/static-server.mjs answers exercises/ with the same output.
            - name: List exercise sets
              run: |
                  export LC_ALL=C
                  shopt -s nullglob
                  mkdir -p .site-stage/exercises
                  cd .site-stage/exercises
                  {
                      printf '<!doctype html>\n<meta charset="utf-8">\n<title>Exercise sets</title>\n'
                      for file in *.json; do
                          [ -f "$file" ] || continue
                          name=$(printf '%s' "$file" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g')
                          # the app percent-decodes every href, so a % in a name is written %25
                          href=$(printf '%s' "$name" | sed -e 's/%/%25/g')
                          printf '<a href="%s">%s</a>\n' "$href" "$name"
                      done
                  } > index.html
            # upload-pages-artifact drops dotfiles by default
            # (it tars with --exclude='.[^/]*'), which would drop .nojekyll.
            # include-hidden-files keeps it; .git and .github stay excluded
            # by the action regardless.
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: .site-stage
                  include-hidden-files: true
            - id: deploy
              uses: actions/deploy-pages@v5
